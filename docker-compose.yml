services:
  tapp-app:
    build: .
    container_name: tapp-local
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - tapp-db

  tapp-db:
    image: postgres:15
    container_name: tapp-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - tapp-db-data:/var/lib/postgresql/data

volumes:
  tapp-db-data: